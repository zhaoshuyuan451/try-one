    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 100vh;
    padding: 6vh 20px 4vh;
  }

  /* 标题区 */
  header {
    text-align: center;
    animation: fadeDown .8s ease both;
  }
  header h1 {
    font-size: clamp(34px, 6vw, 56px);
    font-weight: 600;
    letter-spacing: .08em;
    color: #ffffff;
    text-shadow: 0 2px 12px rgba(31, 64, 87, .45);
  }

  /* 主卡片 */
  main { width: 100%; display: flex; justify-content: center; }

  .card {
    width: min(420px, 88vw);
    aspect-ratio: 1 / 1;
    background: rgba(255, 255, 255, .78);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-radius: 26px;
    box-shadow: 0 18px 46px rgba(31, 64, 87, .22);
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    animation: fadeUp .8s ease .1s both;
  }

  .card-body { display: flex; align-items: flex-start; gap: 26px; }

  .avatar {
    flex: 0 0 auto;
    width: 108px;
    height: 108px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid rgba(255, 255, 255, .9);
    box-shadow: 0 8px 18px rgba(31, 64, 87, .28);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .info { flex: 1; min-width: 0; }
  .info .name {
    font-size: 24px;
    font-weight: 600;
    color: #29404f;
    line-height: 1.2;
  }
  .info .birth {
    margin-top: 6px;
    font-size: 14px;
    color: #8a99a6;
    letter-spacing: .04em;
  }
  .info .intro {
    margin-top: 14px;
    font-size: 15px;
    line-height: 1.75;
    color: #54677a;
  }

  .hobbies {
    margin-top: 16px;
    font-size: 14px;
    color: #4f6b82;
    letter-spacing: .03em;
  }

  /* 底部版权 + AI 标注 */
  footer {
    text-align: center;
    font-size: 13px;
    color: rgba(255, 255, 255, .92);
    text-shadow: 0 1px 6px rgba(31, 64, 87, .4);
    letter-spacing: .05em;
    animation: fadeUp .8s ease .2s both;
  }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp   { from { opacity: 0; transform: translateY(20px); }  to { opacity: 1; transform: none; } }

  /* 窄屏（手机）适配 */
  @media (max-width: 520px) {
    body { padding: 5vh 16px 5vh; }
    .card { padding: 22px 20px; }
    .card-body { flex-direction: column; align-items: center; text-align: center; gap: 14px; }
    .avatar { width: 88px; height: 88px; }
  }
</style>
